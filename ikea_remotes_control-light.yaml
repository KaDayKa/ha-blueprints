blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: damru
  domain: automation
  name: Ikea's Remotes 💡 Light control
  description: >
    ## 💡 Control a light with **IKEA's remotes**

    Currently supported are:
      - Bilresa
      - RODRET
      - SOMRIG
      - TRADFRI ON/OFF
      - STYRBAR
    Only for use with [ZHA](https://www.home-assistant.io/integrations/zha/)
    or Zigbee2MQTT (cf [MQTT](https://www.home-assistant.io/integrations/mqtt)
    + [Z2M addon](https://www.zigbee2mqtt.io/guide/installation/03_ha_addon.html)).

    Available controls:
      - Press **on** button to turn on the light
    (Optional: set the target brightness by enabling **Force Brightness** and setting a **Brightness** value)
      - Press **off** button to turn off the light
      - Hold **on** button to increase the brightness
      - Hold **off** button to decrease the brightness down to 1%
      - Optionally enable scene cycling with a STYRBAR: press **left** to activate the previous scene and **right** to activate the next scene
  input:
    remote_devices:
      name: Remotes
      description: >
        IKEA remote (Bilresa, Rodret, Somrig, Tradfri, STYRBAR) to use.
      default: []
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: 09B9
            - integration: zha
              manufacturer: IKEA of Sweden
              model: RODRET Dimmer
            - integration: zha
              manufacturer: IKEA of Sweden
              model: RODRET wireless dimmer
            - integration: zha
              manufacturer: IKEA of Sweden
              model: SOMRIG shortcut button
            - integration: zha
              manufacturer: IKEA of Sweden
              model: TRADFRI on/off switch
            - integration: mqtt
              manufacturer: IKEA
              model: BILRESA remote control with buttons
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch (E2201)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button (E2213)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch (E1743)
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
              model_id: E2001/E2002/E2313
          multiple: true
    light:
      name: Light
      description: Light to control
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    brightness_section:
      name: Brightness
      icon: mdi:lightbulb-on-50
      collapsed: true
      input:
        helper_force_brightness:
          name: Force brightness
          description: Force the brightness to **Brightness** value when light turns on.
          default: false
          selector:
            boolean: {}
        helper_brightness:
          name: Brightness
          description:
            Target light brightness when turning on. Requires **Force brightness**
            to be enabled.
          default: 50
          selector:
            number:
              unit_of_measurement: "%"
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
    scene_section:
      name: Scenes
      icon: mdi:palette
      collapsed: true
      input:
        enable_scene_cycling:
          name: Enable scene cycling
          description: >
            Enable STYRBAR left/right buttons to cycle through the selected scenes.
            Leave disabled for remotes that do not have left/right buttons.
          default: false
          selector:
            boolean: {}
        scenes:
          name: Scenes
          description: >
            Scenes to cycle through with the STYRBAR left/right buttons.
            The order determines the cycling order.
          default: []
          selector:
            entity:
              filter:
                - domain: scene
              multiple: true
              reorder: true
        scene_index:
          name: Scene index helper
          description: >
            Optional input number helper used to remember the currently selected scene.
            Required only when scene cycling is enabled. Set its initial value to -1
            so the first right press selects the first scene. Leave empty when scene
            cycling is disabled.
          default: null
          selector:
            entity:
              filter:
                - domain: input_number
              multiple: false
mode: restart
max_exceeded: silent
trigger_variables:
  mqtt_enabled: "{{ integration_entities('mqtt') != [] }}"
  remote_devices: !input remote_devices
  zha_enabled: "{{ integration_entities('zha') != [] }}"
triggers:
  ###########################
  # SINGLE PRESSES
  ###########################
  - trigger: event
    event_type: zha_event
    event_data:
      command: "on"
      cluster_id: 6
      endpoint_id: 1
    id: press-on-zha
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: "on"
    id: press-on-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: "off"
      cluster_id: 6
      endpoint_id: 1
    id: press-off-zha
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: "off"
    id: press-off-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: short_release
      endpoint_id: 1
    id: press-on-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 1_short_release
    id: press-on-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: short_release
      endpoint_id: 2
    id: press-off-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 2_short_release
    id: press-off-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
  # STYRBAR scene navigation (Zigbee2MQTT)
  - trigger: mqtt
    topic: "+/+/action"
    payload: arrow_left_click
    id: scene-previous-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: arrow_right_click
    id: scene-next-z2m
    enabled: "{{ mqtt_enabled }}"
  ###########################
  # LONG PRESSES
  ###########################
  - trigger: event
    event_type: zha_event
    event_data:
      command: move_with_on_off
      cluster_id: 8
      endpoint_id: 1
    id: hold-on-zha
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: brightness_move_up
    id: hold-on-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: move
      cluster_id: 8
      endpoint_id: 1
    id: hold-off-zha
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: brightness_move_down
    id: hold-off-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: stop_with_on_off
      endpoint_id: 1
      cluster_id: 8
    id: release-zha
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: brightness_stop
    id: release-z2m
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: long_press
      endpoint_id: 1
    id: hold-on-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 1_long_press
    id: hold-on-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: long_press
      endpoint_id: 2
    id: hold-off-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 2_long_press
    id: hold-off-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: long_release
      endpoint_id: 1
    id: release-hold-on-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 1_long_release
    id: release-hold-on-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
  - trigger: event
    event_type: zha_event
    event_data:
      command: long_release
      endpoint_id: 2
    id: release-hold-off-zha-somrig
    enabled: "{{ zha_enabled }}"
  - trigger: mqtt
    topic: "+/+/action"
    payload: 2_long_release
    id: release-hold-off-z2m-somrig
    enabled: "{{ mqtt_enabled }}"
variables:
  helper_force_brightness: !input helper_force_brightness
  helper_hold_delay: 1
  helper_hold_dim_step: 15
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  is_zha: "{{ trigger.platform == 'event' and trigger.event.event_type == 'zha_event' }}"
  light: !input light
  mqtt_topic: "{{ trigger.topic }}"
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | list }}"
  enable_scene_cycling: !input enable_scene_cycling
  scenes: !input scenes
  scene_index: !input scene_index
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.event.data.device_id in remote_devices if is_zha) or
        (trigger.topic.split('/')[1] in remote_devices_names if is_mqtt)
      }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - scene-previous-z2m
          - condition: template
            value_template: >-
              {{ enable_scene_cycling and scenes | length > 0 and scene_index not in [none, '', []] }}
        sequence:
          - variables:
              next_index: >
                {% set current = states(scene_index) | int(-1) %}
                {% set count = scenes | length %}
                {{ (current - 1) % count }}
          - action: input_number.set_value
            target:
              entity_id: "{{ scene_index }}"
            data:
              value: "{{ next_index }}"
          - action: scene.turn_on
            target:
              entity_id: "{{ scenes[next_index] }}"
            data: {}
      - conditions:
          - condition: trigger
            id:
              - scene-next-z2m
          - condition: template
            value_template: >-
              {{ enable_scene_cycling and scenes | length > 0 and scene_index not in [none, '', []] }}
        sequence:
          - variables:
              next_index: >
                {% set current = states(scene_index) | int(-1) %}
                {% set count = scenes | length %}
                {{ (current + 1) % count }}
          - action: input_number.set_value
            target:
              entity_id: "{{ scene_index }}"
            data:
              value: "{{ next_index }}"
          - action: scene.turn_on
            target:
              entity_id: "{{ scenes[next_index] }}"
            data: {}
      - conditions:
          - condition: trigger
            id:
              - press-on-zha
              - press-on-z2m
              - press-on-zha-somrig
              - press-on-z2m-somrig
        sequence:
          - choose:
              - conditions: "{{ helper_force_brightness }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      brightness_pct: !input helper_brightness
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data: {}
      - conditions:
          - condition: trigger
            id:
              - press-off-zha
              - press-off-z2m
              - press-off-zha-somrig
              - press-off-z2m-somrig
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light
            data: {}
      - conditions:
          - condition: trigger
            id:
              - hold-on-zha
              - hold-on-z2m
              - hold-on-zha-somrig
              - hold-on-z2m-somrig
        sequence:
          - repeat:
              while:
                - condition: trigger
                  id:
                    - hold-on-zha
                    - hold-on-z2m
                    - hold-on-zha-somrig
                    - hold-on-z2m-somrig
              sequence:
                - parallel:
                    - action: light.turn_on
                      target:
                        entity_id: !input light
                      data:
                        brightness_step_pct: "{{ helper_hold_dim_step }}"
                        transition: "{{ helper_hold_delay }}"
                    - delay: "{{ helper_hold_delay }}"
      - conditions:
          - condition: trigger
            id:
              - hold-off-zha
              - hold-off-z2m
              - hold-off-zha-somrig
              - hold-off-z2m-somrig
        sequence:
          - variables:
              brightness_pct: "{{ iif(is_state(light, 'on'), state_attr(light, 'brightness'), 0) * 100 / 255 }}"
              total_iterations_to_zero: "{{ (brightness_pct / helper_hold_dim_step) | round(0, 'ceil') }}"
          - repeat:
              count: "{{ total_iterations_to_zero - 1 }}"
              sequence:
                - parallel:
                    - action: light.turn_on
                      target:
                        entity_id: !input light
                      data:
                        brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                        transition: "{{ helper_hold_delay }}"
                    - delay: "{{ helper_hold_delay }}"
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_pct: 1
              transition: "{{ helper_hold_delay }}"
